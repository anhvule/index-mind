[project]
name = "indexmind"
version = "0.1.0"
description = "Local question answering over your own documents"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Le Anh Vu", email = "anhvu.le291291@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pypdf>=6.19.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
]

[project.scripts]
indexmind = "indexmind.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indexmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
